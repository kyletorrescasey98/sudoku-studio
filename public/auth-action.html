<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sudoku Studio</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#f8f9fa; --surface:#ffffff; --surface2:#f0f2f5;
      --accent:#2563eb; --accent2:#7c3aed; --text:#111827; --text2:#6b7280;
      --error:#dc2626; --success:#16a34a; --border:#d1d5db;
    }
    html, body { overflow:hidden; height:100%; }
    body {
      font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
      background:var(--bg);
      color:var(--text);
      height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    }
    .logo {
      font-size:2.2rem; font-weight:900; letter-spacing:10px; text-transform:uppercase;
      background:linear-gradient(120deg,var(--accent) 30%,var(--accent2));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      margin:6px 0 4px; text-align:center;
    }
    .tagline { font-size:.65rem; color:var(--text2); letter-spacing:3px; text-transform:uppercase; text-align:center; margin-bottom:32px; }
    .card {
      background:var(--surface); border:1px solid var(--border); border-radius:18px;
      padding:32px 36px; width:100%; max-width:420px;
      box-shadow:0 4px 24px rgba(0,0,0,.07); text-align:center;
    }
    .icon { font-size:2.8rem; margin-bottom:12px; }
    h2 { font-size:1.15rem; margin-bottom:8px; color:var(--text); }
    .desc { font-size:.85rem; color:var(--text2); margin-bottom:20px; line-height:1.5; }
    .form-group { display:flex; flex-direction:column; gap:5px; margin-bottom:14px; text-align:left; }
    label { font-size:.72rem; font-weight:700; color:var(--text2); letter-spacing:.5px; text-transform:uppercase; }
    input { padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:.9rem; background:var(--surface); color:var(--text); outline:none; transition:border-color .15s; width:100%; }
    input:focus { border-color:var(--accent); }
    .btn { width:100%; padding:11px; border:none; border-radius:9px; font-size:.9rem; font-weight:700; cursor:pointer; transition:filter .15s; margin-top:4px; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-primary:hover { filter:brightness(1.1); }
    .btn-primary:disabled { opacity:.6; cursor:not-allowed; }
    .msg { font-size:.78rem; padding:9px 12px; border-radius:8px; margin-top:12px; text-align:center; display:none; }
    .msg.error { background:#fef2f2; color:var(--error); border:1px solid #fecaca; display:block; }
    .msg.success { background:#f0fdf4; color:var(--success); border:1px solid #bbf7d0; display:block; }
    .spinner-sm { width:16px; height:16px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:inline-block; vertical-align:middle; margin-right:6px; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .link { color:var(--accent); font-weight:600; text-decoration:none; font-size:.85rem; }
    .link:hover { text-decoration:underline; }
    .footer { margin-top:16px; font-size:.73rem; color:var(--text2); }
  </style>
</head>
<body>
  <div class="logo">Sudoku Social</div>
  <div class="tagline">Challenge your mind</div>
  <div class="card" id="card">
    <div class="icon">⏳</div>
    <h2>Processing…</h2>
    <p class="desc">Please wait while we handle your request.</p>
  </div>

  <script type="module">
    import { initializeApp } from './vendor/firebase/12.9.0/firebase-app.js';
    import { initializeAuth, browserLocalPersistence, applyActionCode, verifyPasswordResetCode, confirmPasswordReset, checkActionCode } from './vendor/firebase/12.9.0/firebase-auth.js';
    import { firebaseConfig } from './firebase-config.js';

    const app  = initializeApp(firebaseConfig);
    const auth = initializeAuth(app, { persistence: browserLocalPersistence });
    const card = document.getElementById('card');

    // Parse URL params
    const params = new URLSearchParams(window.location.search);
    const mode    = params.get('mode');
    const oobCode = params.get('oobCode');

    if (!mode || !oobCode) {
      showError('Invalid link', 'This link appears to be broken or expired.');
    } else {
      switch (mode) {
        case 'verifyEmail':   handleVerifyEmail(oobCode);   break;
        case 'resetPassword': handleResetPassword(oobCode); break;
        case 'recoverEmail':  handleRecoverEmail(oobCode);  break;
        default:              showError('Unknown action', 'This link is not recognized.');
      }
    }

    /* ── Verify Email ──────────────────────────────────────── */
    async function handleVerifyEmail(code) {
      try {
        await applyActionCode(auth, code);
        card.innerHTML = `
          <div class="icon">✅</div>
          <h2>Email Verified!</h2>
          <p class="desc">Your email address has been successfully verified. You're all set to start playing.</p>
          <a class="btn btn-primary" href="/index.html" style="display:block;text-decoration:none;color:#fff;line-height:1.4">Continue to Sudoku Studio</a>
        `;
      } catch (e) {
        if (e.code === 'auth/invalid-action-code') {
          card.innerHTML = `
            <div class="icon">⚠️</div>
            <h2>Link Expired</h2>
            <p class="desc">This verification link has expired or has already been used. Please sign in and request a new one.</p>
            <a class="btn btn-primary" href="/index.html" style="display:block;text-decoration:none;color:#fff;line-height:1.4">Go to Sign In</a>
          `;
        } else {
          showError('Verification Failed', 'We couldn\'t verify your email. The link may be expired or invalid. Please try signing in and requesting a new link.');
        }
      }
    }

    /* ── Reset Password ────────────────────────────────────── */
    async function handleResetPassword(code) {
      try {
        const email = await verifyPasswordResetCode(auth, code);
        card.innerHTML = `
          <div class="icon">🔑</div>
          <h2>Reset Your Password</h2>
          <p class="desc">Enter a new password for <strong>${email}</strong></p>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="new-pass" placeholder="Min 6 characters" />
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirm-pass" placeholder="Re-enter password" />
          </div>
          <button class="btn btn-primary" id="reset-btn">Reset Password</button>
          <div class="msg" id="reset-msg"></div>
        `;
        document.getElementById('reset-btn').addEventListener('click', async () => {
          const pass1 = document.getElementById('new-pass').value;
          const pass2 = document.getElementById('confirm-pass').value;
          const msg   = document.getElementById('reset-msg');
          const btn   = document.getElementById('reset-btn');

          if (!pass1 || !pass2) { msg.textContent = 'Please fill in both fields.'; msg.className = 'msg error'; return; }
          if (pass1.length < 6) { msg.textContent = 'Password must be at least 6 characters.'; msg.className = 'msg error'; return; }
          if (pass1 !== pass2)  { msg.textContent = 'Passwords do not match.'; msg.className = 'msg error'; return; }

          btn.disabled = true;
          btn.innerHTML = '<span class="spinner-sm"></span>Resetting…';
          try {
            await confirmPasswordReset(auth, code, pass1);
            card.innerHTML = `
              <div class="icon">✅</div>
              <h2>Password Reset!</h2>
              <p class="desc">Your password has been updated successfully. You can now sign in with your new password.</p>
              <a class="btn btn-primary" href="/index.html" style="display:block;text-decoration:none;color:#fff;line-height:1.4">Sign In</a>
            `;
          } catch (e) {
            msg.textContent = e.code === 'auth/weak-password' ? 'Password must be at least 6 characters.' : 'Failed to reset password. The link may have expired.';
            msg.className = 'msg error';
            btn.disabled = false;
            btn.textContent = 'Reset Password';
          }
        });

        // Enter key support
        document.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('reset-btn')?.click(); });
      } catch (e) {
        card.innerHTML = `
          <div class="icon">⚠️</div>
          <h2>Link Expired</h2>
          <p class="desc">This password reset link has expired or has already been used. Please request a new one.</p>
          <a class="btn btn-primary" href="/index.html" style="display:block;text-decoration:none;color:#fff;line-height:1.4">Go to Sign In</a>
        `;
      }
    }

    /* ── Recover Email ─────────────────────────────────────── */
    async function handleRecoverEmail(code) {
      try {
        const info = await checkActionCode(auth, code);
        await applyActionCode(auth, code);
        card.innerHTML = `
          <div class="icon">✅</div>
          <h2>Email Restored</h2>
          <p class="desc">Your email has been restored to <strong>${info.data.email}</strong>.</p>
          <a class="btn btn-primary" href="/index.html" style="display:block;text-decoration:none;color:#fff;line-height:1.4">Continue</a>
        `;
      } catch (e) {
        showError('Recovery Failed', 'We couldn\'t recover your email. The link may have expired.');
      }
    }

    /* ── Helpers ───────────────────────────────────────────── */
    function showError(title, desc) {
      card.innerHTML = `
        <div class="icon">❌</div>
        <h2>${title}</h2>
        <p class="desc">${desc}</p>
        <a class="btn btn-primary" href="/index.html" style="display:block;text-decoration:none;color:#fff;line-height:1.4">Go to Sign In</a>
      `;
    }
  </script>
</body>
</html>
